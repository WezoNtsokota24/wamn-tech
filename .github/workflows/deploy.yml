name: Deploy Wamn Tech to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Purge Old Build Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing artifacts to free up storage quota..."
          ARTIFACT_IDS=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[].id')
          if [ -n "$ARTIFACT_IDS" ]; then
            for id in $ARTIFACT_IDS; do
              echo "Deleting artifact ID: $id"
              gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
            done
          else
            echo "No old artifacts found."
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
